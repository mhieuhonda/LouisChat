name: Build & Sign APK

# Triggers on every published Release (i.e. when you create a GitHub Release
# off a tag). The resulting signed APK is attached to that release.
on:
  release:
    types: [published]
  # Allow manual runs from the Actions tab
  workflow_dispatch:

jobs:
  build:
    name: Build signed release APK
    runs-on: ubuntu-latest

    permissions:
      contents: write   # needed to upload assets to a release

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter doctor
        run: flutter doctor -v

      - name: Ensure Android platform files
        working-directory: app
        # `flutter create` is idempotent — it will NOT overwrite pubspec.yaml,
        # but it will fill in any missing android/ files (gradle wrapper, etc.).
        run: flutter create --platforms=android --project-name=louischat --org com.louischat .

      - name: Read pubspec version
        id: ver
        working-directory: app
        run: |
          v=$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d '+' -f 1)
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "Detected version: $v"

      - name: Install dependencies
        working-directory: app
        run: flutter pub get

      - name: Generate keystore (if no signing secret provided)
        id: keystore
        working-directory: app/android
        run: |
          if [ -z "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "No KEYSTORE_BASE64 secret — generating a fresh keystore for this build."
            keytool -genkeypair -v \
              -keystore release.keystore \
              -storepass louischat \
              -alias louischat \
              -keypass louischat \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=LouisChat, OU=Mobile, O=LouisChat, L=Hanoi, ST=Hanoi, C=VN"
            printf 'storePassword=louischat\nkeyPassword=louischat\nkeyAlias=louischat\nstoreFile=release.keystore\n' > key.properties
          else
            echo "Using provided KEYSTORE_BASE64 secret."
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > release.keystore
            printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=release.keystore\n' \
              "${{ secrets.STORE_PASSWORD }}" "${{ secrets.KEY_PASSWORD }}" "${{ secrets.KEY_ALIAS }}" > key.properties
          fi
          # Verify
          ls -la release.keystore key.properties
          echo "keystore_dir=$(pwd)" >> "$GITHUB_OUTPUT"

      - name: Build release APK
        working-directory: app
        run: flutter build apk --release --build-name=${{ steps.ver.outputs.version }} --build-number=${{ github.run_number }}

      - name: Sign & verify APK
        working-directory: app
        run: |
          APK="build/app/outputs/flutter-apk/app-release.apk"
          ls -la "$APK"
          # Flutter already signs via the gradle signingConfig we wired up.
          # Sanity-check that the APK is signed.
          "${ANDROID_HOME}/build-tools/34.0.0/apksigner" verify --print-certs "$APK" || true

      - name: Rename APK
        id: artifact
        working-directory: app
        run: |
          VERSION="${{ steps.ver.outputs.version }}"
          NEW_NAME="louischat-v${VERSION}-android.apk"
          cp build/app/outputs/flutter-apk/app-release.apk "$NEW_NAME"
          sha256sum "$NEW_NAME" > "$NEW_NAME.sha256"
          echo "name=$NEW_NAME" >> "$GITHUB_OUTPUT"
          echo "path=$(pwd)/$NEW_NAME" >> "$GITHUB_OUTPUT"
          echo "sha_path=$(pwd)/$NEW_NAME.sha256" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: louischat-apk
          path: |
            app/louischat-v*.apk
            app/louischat-v*.apk.sha256

      - name: Attach APK to the Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ steps.artifact.outputs.path }}
            ${{ steps.artifact.outputs.sha_path }}

      - name: Clean sensitive files
        if: always()
        working-directory: app/android
        run: |
          rm -f release.keystore key.properties || true
